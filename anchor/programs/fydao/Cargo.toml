[package]
name = "fydao"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "fydao"

[features]
default = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint", "anchor-lang/init-if-needed"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", features = ["metadata"] }

[dev-dependencies]
# LiteSVM is used to run real on-chain integration tests (H8). litesvm 0.15.2
# targets the agave 4.1.1 line; the crates below are pinned to that line
# because the agave 4.2.0 releases changed internal types (e.g. the
# `ExecutionRecord` field rename) and break litesvm's compilation.
anchor-lang = "1.1.2"
borsh = "1.8.0"
litesvm = "0.15.2"
agave-feature-set = "=4.1.1"
agave-reserved-account-keys = "=4.1.1"
solana-account = "4.3.2"
solana-address = "2.6.1"
solana-bpf-loader-program = "=4.1.1"
solana-builtins = "=4.1.1"
solana-builtins-default-costs = "=4.1.1"
solana-clock = "3.1.1"
solana-compute-budget = "=4.1.1"
solana-compute-budget-instruction = "=4.1.1"
solana-compute-budget-program = "=4.1.1"
solana-fee = "=4.1.1"
solana-instruction = "3.4.1"
solana-keypair = "3.1.2"
solana-message = "4.4.1"
solana-program-pack = "3.1.0"
solana-program-runtime = "=4.1.1"
solana-pubkey = "4.2.1"
solana-sha256-hasher = "=3.1.0"
solana-rent = "4.3.0"
solana-signer = "3.0.1"
solana-svm-callback = "=4.1.1"
solana-svm-feature-set = "=4.1.1"
solana-svm-log-collector = "=4.1.1"
solana-svm-measure = "=4.1.1"
solana-svm-timings = "=4.1.1"
solana-svm-transaction = "=4.1.1"
solana-svm-type-overrides = "=4.1.1"
solana-syscalls = "=4.1.1"
solana-system-interface = "3.2.0"
solana-system-program = "=4.1.1"
solana-sysvar = "4.1.0"
solana-hash = "=4.5.0"
solana-transaction = "4.1.6"
solana-transaction-context = "=4.1.1"
solana-vote-program = "=4.1.1"
solana-zk-elgamal-proof-program = "=4.1.1"
solana-zk-token-proof-program = "=4.1.1"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "2.0.0"
