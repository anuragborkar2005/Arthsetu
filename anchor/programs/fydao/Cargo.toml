[package]
name = "fydao"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "fydao"

[features]
default = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint", "anchor-lang/init-if-needed"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", features = ["metadata"] }
